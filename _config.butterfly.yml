  个人||fas fa-user:
    关于我: /about/ || fas fa-user-circle
    联系我: /message/ || fas fa-paper-plane

favicon: /img/favicon.ico

avatar:
  img: /img/avatar.jpg
  effect: false

index_img: /img/hero-miku.jpg
default_top_img: /img/hero-miku.jpg
archive_img: /img/hero-miku.jpg
tag_img: /img/hero-miku.jpg
category_img: /img/hero-miku.jpg
footer_img: false

index_site_info_top: 50%
index_top_img_height: 100vh

subtitle:
  enable: true
  effect: true
  typed_option:
    typeSpeed: 90
    backSpeed: 46
    startDelay: 500
    backDelay: 1800
    loop: true
    showCursor: true
    cursorChar: "|"
  sub:
    - 雪花沿着晨光轻轻落下。
    - 星光沿着夜色缓缓漂流。
index_layout: 3
index_post_content:
  method: 3
  length: 180

post_meta:
  page:
    date_type: created
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    position: left
    date_type: both
    date_format: date
    categories: true
    tags: true
    label: true

aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 记录代码、灵感与日常探索。
    button:
      enable: true
      icon: fas fa-paper-plane
      text: 去看看
      link: /
  card_announcement:
    enable: true
    content: 欢迎来到 qianny 的博客，愿每次到访都有一点新的发现。
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 30
    color: false
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 6
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

social:
  fas fa-house: / || 首页 || "#67d3dc"
  fas fa-message: /message/ || 留言 || "#8ec5ff"
  fas fa-envelope: mailto:1365664464@qq.com || 邮箱 || "#a9ddff"
  fab fa-qq: https://wpa.qq.com/msgrd?v=3&uin=1365664464&site=qq&menu=yes || QQ || "#8ec5ff"
  fab fa-weixin: weixin:// || 微信 || "#7ad98f"
  fab fa-github: https://github.com/qianniany || GitHub || "#dfe8ff"
  fab fa-bilibili: https://space.bilibili.com/301729113?spm_id_from=333.1007.0.0 || Bilibili || "#ff8fc7"

theme_color:
  enable: true
  main: "#67d3dc"
  paginator: "#8ec5ff"
  button_hover: "#8edfff"
  text_selection: "#14314a"
  link_color: "#8ec5ff"
  meta_color: "#9ba8c5"
  hr_color: "#27455c"
  code_foreground: "#8edfff"
  code_background: "rgba(103, 211, 220, 0.08)"
  toc_color: "#8ec5ff"
  blockquote_padding_color: "#67d3dc"
  blockquote_background_color: "rgba(103, 211, 220, 0.08)"
  scrollbar_color: "#3d6f90"
  meta_theme_color_light: "#091019"
  meta_theme_color_dark: "#091019"

rounded_corners_ui: true
enter_transitions: true
display_mode: dark
readmode: false

