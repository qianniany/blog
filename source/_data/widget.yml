top:
  - class_name: card-quote-panel
    id_name: card-quote-panel
    name: Signal Board
    icon: fas fa-satellite-dish
    html: |
      <div class="signal-board">
        <div class="signal-board__label">Night Channel</div>
        <p class="signal-board__text">Build quietly, ship steadily, and leave every page with a little more atmosphere than before.</p>
        <div class="signal-board__grid">
          <a class="signal-board__cell" href="/blog/archives/">
            <span>Archive</span>
            <strong>Browse</strong>
          </a>
          <a class="signal-board__cell" href="/blog/tags/">
            <span>Tags</span>
            <strong>Explore</strong>
          </a>
          <a class="signal-board__cell" href="/blog/categories/">
            <span>Categories</span>
            <strong>Navigate</strong>
          </a>
          <a class="signal-board__cell" href="/blog/">
            <span>Home</span>
            <strong>Return</strong>
          </a>
        </div>
      </div>

bottom:
  - class_name: card-terminal-panel
    id_name: card-terminal-panel
    name: Status Feed
    icon: fas fa-wave-square
    html: |
      <div class="status-feed">
        <div class="status-feed__item">
          <span class="status-feed__dot"></span>
          <span>Theme aligned to dark glass interface</span>
        </div>
        <div class="status-feed__item">
          <span class="status-feed__dot"></span>
          <span>Homepage running full-screen hero mode</span>
        </div>
        <div class="status-feed__item">
          <span class="status-feed__dot"></span>
          <span>Navigation locked to the top channel</span>
        </div>
      </div>
